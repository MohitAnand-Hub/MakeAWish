
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make A Wish - Coin Toss</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #141E30, #243B55);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-shadow: 0px 2px 10px rgba(0,0,0,0.5);
    }

    .coin {
      width: 160px;
      height: 160px;
      background: #f0f0f0;
      color: #333;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      user-select: none;
      transition: transform 1s ease;
    }

    .coin:hover {
      transform: scale(1.05);
    }

    .result {
      font-size: 1.5rem;
      margin-top: 30px;
      min-height: 40px;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Make A Wish</h1>
  <div class="coin" id="coin">Click</div>
  <div class="result" id="result">Tap the coin to toss</div>
  <footer>Designed and Published by Mohit Anand</footer>

  <audio id="flipSound" src="https://www.soundjay.com/button/sounds/button-16.mp3" preload="auto"></audio>

  <script>
    const coin = document.getElementById('coin');
    const result = document.getElementById('result');
    const sound = document.getElementById('flipSound');

    function tossCoin() {
      result.textContent = 'Flipping...';
      sound.currentTime = 0;
      sound.play();

      coin.style.transform = `rotateY(${1440 + Math.random() * 360}deg)`;

      setTimeout(() => {
        const rand = new Uint32Array(1);
        crypto.getRandomValues(rand);
        const outcome = rand[0] % 2 === 0 ? 'HEADS' : 'TAILS';
        coin.textContent = outcome;
        result.textContent = `Result: ${outcome}`;
      }, 1200);
    }

    coin.addEventListener('click', tossCoin);
  </script>
</body>
</html>
