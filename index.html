<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coin Toss</title>
  <style>
    body {
      background: #f0f8ff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 100px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .coin {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, #dcdcdc 0%, #f5f5f5 100%);
      border: 5px solid #ccc;
      border-radius: 50%;
      line-height: 150px;
      font-size: 30px;
      font-weight: bold;
      margin: 0 auto 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.6s ease-in-out;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #4CAF50;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .result {
      margin-top: 20px;
      font-size: 24px;
      color: #333;
    }

    footer {
      margin-top: auto;
      padding: 20px 0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="coin" id="coin">?</div>
  <button onclick="tossCoin()">Toss Coin</button>
  <div class="result" id="result"></div>

  <footer>
    Designed and Published by Mohit Anand
  </footer>

  <script>
    function tossCoin() {
      const outcomes = ['Heads', 'Tails'];
      const result = outcomes[Math.floor(Math.random() * 2)];
      const coin = document.getElementById('coin');
      coin.style.transform = 'rotateY(360deg)';
      setTimeout(() => {
        coin.textContent = result;
        document.getElementById('result').textContent = `Result: ${result}`;
        coin.style.transform = 'rotateY(0deg)';
      }, 600);
    }
  </script>
</body>
</html>
