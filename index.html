<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Indian Coin Toss</title>
  <style>
    body {
      background: linear-gradient(135deg, #6e7a6b, #dde1e0);
      font-family: 'Roboto', sans-serif;
      text-align: center;
      padding-top: 5%;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    h1 {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .coin {
      width: 180px;
      height: 180px;
      margin: 30px auto;
      perspective: 1000px;
    }

    .coin-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #ffd700;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transform-style: preserve-3d;
      transition: transform 1.5s ease-in-out;
    }

    .coin .tail {
      background-color: #ff5c33;
      color: white;
    }

    button {
      padding: 20px 40px;
      font-size: 22px;
      background-color: #ff2d00;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      background-color: #ff5733;
      transform: scale(1.1);
    }

    .result {
      margin-top: 20px;
      font-size: 28px;
      color: #f4f4f4;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    }

    footer {
      margin-top: 50px;
      font-size: 16px;
      color: #cccccc;
    }

    button:hover {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Indian Coin Toss</h1>
  <div class="coin" id="coin">
    <div id="coinFace" class="coin-face">Heads</div>
  </div>
  <button onclick="tossCoin()">Toss Coin</button>
  <div class="result" id="result">Click the button to toss</div>

  <footer>
    Designed and Published by Mohit Anand
  </footer>

  <script>
    function tossCoin() {
      const outcomes = [
        {
          side: 'Heads',
          className: 'coin-face'
        },
        {
          side: 'Tails',
          className: 'coin-face tail'
        }
      ];

      const coinFace = document.getElementById('coinFace');
      const resultText = document.getElementById('result');

      // Play sound on flip
      const flipSound = new Audio('https://www.soundjay.com/button/beep-07.wav'); // Sample beep sound
      flipSound.play();

      resultText.textContent = 'Flipping...';

      // Use crypto.getRandomValues() for randomness
      const randomValues = new Uint32Array(1);
      window.crypto.getRandomValues(randomValues);
      const randIndex = randomValues[0] % 2; // 0 or 1

      // Coin flip animation (rotate and spin)
      const spinDegrees = 1440 + (Math.random() * 360); // Random spin for additional unpredictability
      const randomSpinDuration = 1.2 + Math.random() * 1.5; // Random duration for spinning

      coinFace.style.transition = `transform ${randomSpinDuration}s ease-in-out`; // Randomize spin time
      coinFace.style.transform = `rotateY(${spinDegrees}deg)`;

      const delay = 1200 + Math.floor(Math.random() * 600); // Random delay for realism

      setTimeout(() => {
        const result = outcomes[randIndex];

        coinFace.textContent = result.side;
        coinFace.className = result.className;
        coinFace.style.transform = 'rotateY(0deg)';
        resultText.textContent = `Result: ${result.side}`;
      }, delay);
    }
  </script>
</body>
</html>
